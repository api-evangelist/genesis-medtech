aid: genesis-medtech
name: Genesis Medtech
description: 'Genesis MedTech is a global medical device company founded in Singapore in 2019, building
  and commercializing advanced clinical solutions across surgical, vascular intervention, and structural
  heart categories. It operates a vertically integrated platform that sources global medical technologies,
  develops them through in-house and partner R&D, manufactures at scale, and distributes across more than
  30 countries. Its portfolio includes the J-Valve structural heart system, the iReach Omnia articulating
  powered surgical stapler, and neurovascular and peripheral vascular intervention product lines. Genesis
  MedTech is a portfolio company of Hongshan (formerly Sequoia Capital China). It publishes a corporate
  and product marketing presence only; no public developer program, API, or technical documentation surface
  was found during enrichment.'
